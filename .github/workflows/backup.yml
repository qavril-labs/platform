name: Backup
# Nightly logical backup of the platform database to S3. Runs from main only, under an
# OIDC role that can write only to platform/ in the backup bucket. Neon's own window is 6 hours.
on:
  workflow_dispatch:
  # schedule is enabled once qavril/prod/platform/backup-url exists in Secrets Manager:
  # schedule:
  #   - cron: "30 20 * * *"   # 02:00 IST
permissions:
  id-token: write
  contents: read
jobs:
  backup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Diagnose OIDC claims (temporary)
        run: |
          tok=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python -c "import json,sys; print(json.load(sys.stdin)['value'])")
          echo "$tok" | cut -d. -f2 | python -c "import base64,json,sys; p=sys.stdin.read().strip(); p+='='*(-len(p)%4); d=json.loads(base64.urlsafe_b64decode(p)); print('sub=',d.get('sub')); print('aud=',d.get('aud')); print('iss=',d.get('iss'))"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::929219061572:role/qavril-backup-writer
          aws-region: ap-south-1
      - name: Read the backup URL from Secrets Manager (masked in logs)
        run: |
          url="$(aws secretsmanager get-secret-value --secret-id qavril/prod/platform/backup-url --query SecretString --output text)"
          echo "::add-mask::$url"
          echo "BACKUP_URL=$url" >> "$GITHUB_ENV"
      - name: Dump and upload
        env:
          BACKUP_BUCKET: qavril-backups-prod-qv7k2
          SERVICE: platform
        run: bash scripts/backup.sh
