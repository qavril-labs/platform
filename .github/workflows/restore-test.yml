name: Restore test
# Proves that a production backup can be restored. Runs against a Postgres 18 service
# container, so no real data and no AWS access is needed. Also runs weekly.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SOURCE_URL: postgresql://postgres:test@localhost:5432/source
      RESTORED_URL: postgresql://postgres:test@localhost:5432/restored
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install PostgreSQL 18 client tools (match the server version)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          pg_dump --version
      - run: npm ci
      - name: Create databases and apply migrations to the source
        run: |
          psql "postgresql://postgres:test@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c "CREATE DATABASE source" -c "CREATE DATABASE restored"
          OWNER_URL="$SOURCE_URL" npm run migrate
          OWNER_URL="$SOURCE_URL" npm run migrate   # second run must apply nothing and succeed
      - name: Seed one tenant and one audit row
        run: |
          psql "$SOURCE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO core.tenants (id, name) VALUES ('11111111-1111-4111-8111-111111111111', 'Sample Co')"
          psql "$SOURCE_URL" -v ON_ERROR_STOP=1 -c "SET app.tenant_id = '11111111-1111-4111-8111-111111111111'; INSERT INTO core.audit_log (id, tenant_id, actor_id, action, entity_type, entity_id) VALUES ('22222222-2222-4222-8222-222222222222', '11111111-1111-4111-8111-111111111111', '33333333-3333-4333-8333-333333333333', 'create', 'sample', '1')"
      - name: Take a dump of the source
        run: pg_dump --format=custom --no-owner --no-acl --file /tmp/source.dump "$SOURCE_URL"
      - name: Restore into the scratch database and check
        run: |
          DUMP_FILE=/tmp/source.dump RESTORE_TARGET_URL="$RESTORED_URL" bash scripts/restore-test.sh
          src=$(psql "$SOURCE_URL" -At -c "SELECT count(*) FROM core.tenants")
          dst=$(psql "$RESTORED_URL" -At -c "SELECT count(*) FROM core.tenants")
          test "$src" = "$dst" && echo "tenants match: $dst"
          audit=$(psql "$RESTORED_URL" -At -c "SELECT count(*) FROM core.audit_log")
          test "$audit" = "1" && echo "audit rows restored: $audit"
          # The audit log must still refuse changes after restore.
          if psql "$RESTORED_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM core.audit_log" 2>/dev/null; then
            echo "audit log accepted a delete after restore" && exit 1
          else
            echo "audit log still append-only after restore"
          fi
